<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>placeofthoughts</title>



<style>

  * {

    box-sizing: border-box;

  }



  html,

  body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: transparent;

  }



  body {

    font-family: "Courier New", Courier, monospace;

    letter-spacing: 0.04em;

    line-height: 1;

    font-weight: 400;

    color: #39291c;

  }



  /* =========================================================

     ГЛАВНЫЙ ПРИНЦИП

     ========================================================= */



  .scene {

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: transparent;

  }



  .book-stage {

    --book-scale: 1;



    position: absolute;

    left: 50%;

    top: 50%;



    width: 1553px;

    height: 938px;



    transform: translate(-50%, -50%) scale(var(--book-scale));

    transform-origin: center center;



    overflow: visible;

    will-change: transform;

  }



  .book-shell {

    position: absolute;

    inset: 0;



    width: 100%;

    height: 100%;



    display: block;

    object-fit: contain;



    pointer-events: none;

    user-select: none;



    z-index: 0;

  }



  /* Обложка - отдельный слой над страницами, но под закладками.
     Более специфичный селектор предотвращает конфликт с .portrait-warp ниже. */
  .book-cover.portrait-warp {
    position: absolute;

    /* Подгоняй эти 4 значения под свой рисунок раскрытой книги. */
    left: 0%;
    top: 0%;
    width: 100%;
    height: 97%;

    display: block;
    object-fit: fill;
    z-index: 40;
    pointer-events: none;
    user-select: none;
    transform-origin: 0 0;
    opacity: 1;
    visibility: visible;
    transition: opacity .22s ease, visibility .22s ease;
  }

  /* Первая загрузка: обложка скрывает страницы и навигацию,
     но НЕ закладки (они имеют z-index: 100). */
  .book-stage.is-covered .page-overlay,
  .book-stage.is-covered .navigation {
    opacity: 0;
    pointer-events: none;
  }

  /* После выбора закладки обложка исчезает. */
  .book-stage:not(.is-covered) .book-cover {
    opacity: 0;
    visibility: hidden;
  }



  /* =========================================================

     СТРАНИЦЫ

     ========================================================= */



  .page-overlay {

    position: absolute;

    z-index: 5;



    overflow: hidden;

    padding: 19px;



    background: transparent;

    transform-origin: center;

  }



  .page-overlay.left {

    left: -15%;

    top: 8%;

    width: 100%;

    height: 100%;



    transform: rotate(9deg);

  }



  .page-overlay.right {

    left: 53%;

    top: 15.85%;

    width: 35%;

    height: 59.19%;



    transform: rotate(-5deg);

  }



  .page-content {

    height: 100%;



    opacity: 1;

    transform: translateY(0);



    transition:

      opacity 0.18s ease,

      transform 0.18s ease;

  }



  .page-content {

    height: 100%;



    opacity: 1;

    transform: translateY(0);



    transition:

      opacity 0.18s ease,

      transform 0.18s ease;



  }

   .page-dress {

  position: absolute;

  inset: 0;



  z-index: 15;



  pointer-events: none;



  }



.page-decor {

  position: absolute;



  left: var(--x, 0%);

  top: var(--y, 0%);



  width: var(--w, 20%);

  height: auto;



  transform: rotate(var(--r, 0deg));



  transform-origin: center;



  }



  .page-content.changing {

    opacity: 0;

    transform: translateY(5px);

  }



  .section-label {

    margin-bottom: 0.55em;



    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 0.18em;



    opacity: 0.55;

  }



  h1,

  h2,

  p {

    margin-top: 0;

  }



  h1 {

    margin-bottom: 0.65em;



    font-size: 27px;

    font-weight: 500;

    line-height: 1.05;

  }



  h2 {

    margin-bottom: 0.7em;



    font-size: 18px;

    font-weight: 600;

  }



  p {

    margin-bottom: 0.85em;



    font-size: 17px;

    line-height: 2;

  }



  .placeholder-box {

    width: 40%;

    height: 70%;

    margin-bottom: 1em;



    display: flex;

    align-items: stretch;

    justify-content: stretch;



    border: 0px dashed rgba(0, 0, 0, 0.90);



    font-size: 12px;

    text-align: center;

    opacity: .70;

  }

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

  }





  /* =========================================================

     ИЛЛЮСТРАЦИИ НА ЛЕВОЙ СТРАНИЦЕ



     .portrait-wrap отвечает только за положение и обычный поворот.

     .portrait-warp получает перспективу через JS / matrix3d.

     ========================================================= */



  .portrait-wrap {

    position: absolute;

    left: 30%;

    top: 1%;

    width: 30%;



    overflow: visible;

    transform: rotate(1deg);

    transform-origin: center center;

  }



  .portrait-warp {

    display: block;

    width: 100%;

    height: auto;



    transform-origin: 0 0;

    will-change: transform;

  }



  /* =========================================================

     ЗАКЛАДКИ

     ========================================================= */



  .tab {

    position: absolute;

    z-index: 100;

    pointer-events: auto;



    width: 120px;

    height: 120px;



    border: 0;

    padding: 0;

    border-radius: 14px 0 0 14px;



    display: flex;

    align-items: center;

    justify-content: center;



    box-shadow:

      0 3px 8px rgba(0, 0, 0, 0.25),

      inset 0 0 0 1px rgba(255, 230, 177, 0.12);



    cursor: pointer;



    transition:

      filter 0.18s ease,

      translate 0.18s ease;

  }



  .tab[data-section="people"] {

    left: 8%;

    top: 10%;

    background: rgba(91, 93, 74, 0.94);

    transform: rotate(9deg);

  }



  .tab[data-section="places"] {

    left: 5.5%;

    top: 28%;

    background: rgba(91, 93, 74, 0.94);

    transform: rotate(11deg);

  }



  .tab[data-section="organizations"] {

    left: 91%;

    top: 47%;

    background: rgba(132, 104, 55, 0.94);

    transform: rotate(-188deg);

  }



  .tab[data-section="objects"] {

    left: 2.3%;

    top: 55%;

    background: rgba(92, 54, 40, 0.94);

    transform: rotate(9deg);

  }



  .tab:hover {

    filter: brightness(1.16);

    translate: 1px 0;

  }



  .tab.active {

    filter: brightness(1.28);

    translate: 1px 0;

  }



  .tab img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: contain;

    border-radius: inherit;

    pointer-events: none;

  }



  /* =========================================================

     НАВИГАЦИЯ

     Важно: translate + rotate теперь находятся В ОДНОМ transform.

     В старом коде второй transform перезаписывал первый.

     ========================================================= */



  .navigation {

    position: absolute;

    z-index: 25;



    left: 71%;

    bottom: 21%;



    display: flex;

    align-items: center;

    gap: 16px;



    transform: translateX(-50%) rotate(-5deg);

  .nav-button {

    cursor: pointer;

    border: 1px solid rgba(225, 192, 139, 0.25);

    border-radius: 50%;



    background: rgba(43, 31, 23, 0.1);

    color: transparent;



    cursor: pointer;

    font-size: 23px;



    box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);

    font-size: 23px;

    color: #8B4513;

  }



  .nav-button:disabled {

    opacity: 0.25;

    cursor: default;

  }



  .page-counter {

    min-width: 4em;

    padding: 5px 9px;



    border-radius: 999px;



    font-size: 16px;

    text-align: center;

    color: #8B4513;

  }



  /* =========================================================

     ========================================================= */



  body.debug .book-stage {

</style>

   y > 0  = угол идет вниз



   Координаты ниже — мягкая стартовая перспектива под левую

   страницу. У каждого изображения настройки отдельные.

   ========================================================= */

function warpImage(el, corners) {

  const width = el.offsetWidth;

  const height = el.offsetHeight;



  if (!width || !height) return;



  const p0 = {

    x: corners.topLeft.x,

    y: corners.topLeft.y

  };



  const p1 = {

    x: width + corners.topRight.x,

    y: corners.topRight.y

  };



  const p2 = {

    x: width + corners.bottomRight.x,

    y: height + corners.bottomRight.y

  };



  const p3 = {

    x: corners.bottomLeft.x,

    y: height + corners.bottomLeft.y

  };



  const dx1 = p1.x - p2.x;

  const dx2 = p3.x - p2.x;

  const dx3 = p0.x - p1.x + p2.x - p3.x;



  const dy1 = p1.y - p2.y;

  const dy2 = p3.y - p2.y;

  const dy3 = p0.y - p1.y + p2.y - p3.y;



  const det = dx1 * dy2 - dx2 * dy1;



  // Защита от вырожденной фигуры, чтобы не получить NaN/Infinity.

  if (Math.abs(det) < 0.000001) {

    console.warn("warpImage: некорректные координаты углов", el.id);

    return;

  }



  const g = (dx3 * dy2 - dx2 * dy3) / det;

  const h = (dx1 * dy3 - dx3 * dy1) / det;



  const a = p1.x - p0.x + g * p1.x;

  const b = p3.x - p0.x + h * p3.x;

  const c = p0.x;



  const d = p1.y - p0.y + g * p1.y;

  const e = p3.y - p0.y + h * p3.y;

  const f = p0.y;



  const matrix = [

    a / width,  d / width,  0, g / width,

    b / height, e / height, 0, h / height,

    0,          0,          1, 0,

    c,          f,          0, 1

  ];



  el.style.transform = `matrix3d(${matrix.join(",")})`;

}



function applyWarp(img) {

  const corners = WARP_CONFIG[img.id];



  if (!corners) return;



  const runWarp = () => {

    requestAnimationFrame(() => {

      if (!img.isConnected) return;

      if (!img.offsetWidth || !img.offsetHeight) return;



      warpImage(img, corners);

    });

  };



  // Картинка уже успела загрузиться.

  if (img.complete && img.naturalWidth > 0) {

    runWarp();

    return;

  }



  // Картинка еще грузится: ждем ее реального размера.

  img.addEventListener("load", runWarp, { once: true });

}



function applyAllWarps() {

  document.querySelectorAll(".portrait-warp").forEach(applyWarp);

}





/* =========================================================

   СТРАНИЦЫ И НАВИГАЦИЯ

   ========================================================= */



let currentSection = "people";

let currentPage = 0;



const leftPage = document.getElementById("leftPage");

const rightPage = document.getElementById("rightPage");

const prevButton = document.getElementById("prevButton");

const nextButton = document.getElementById("nextButton");

const pageCounter = document.getElementById("pageCounter");

const tabs = document.querySelectorAll(".tab");



function renderPage(animate = true) {

  const page = sections[currentSection].pages[currentPage];



  if (!animate) {

    updateContent(page);

    return;

  }



  leftPage.classList.add("changing");

  rightPage.classList.add("changing");



  setTimeout(() => {

    updateContent(page);

    leftPage.classList.remove("changing");

    rightPage.classList.remove("changing");

  }, 180);

}



function updateContent(page) {

  leftPage.innerHTML = page.left;

  rightPage.innerHTML = page.right;



  const total = sections[currentSection].pages.length;



  pageCounter.textContent = `${currentPage + 1} / ${total}`;



  prevButton.disabled = currentPage === 0;

  nextButton.disabled = currentPage === total - 1;



  // ВАЖНО: перспективу накладываем ПОСЛЕ того,

  // как новая страница уже появилась в DOM.

  applyAllWarps();

}



/* Закладки открывают дневник. */
function hideCover() {
  document.querySelector(".book-stage").classList.remove("is-covered");
}

tabs.forEach(tab => {

  tab.addEventListener("click", () => {
    hideCover();

    currentSection = tab.dataset.section;

    currentPage = 0;



    tabs.forEach(item => item.classList.remove("active"));

    tab.classList.add("active");



    renderPage();

  });

});



nextButton.addEventListener("click", () => {
  hideCover();

  const total = sections[currentSection].pages.length;



  if (currentPage < total - 1) {

    currentPage++;

    renderPage();

  }

});



prevButton.addEventListener("click", () => {
  hideCover();

  if (currentPage > 0) {

    currentPage--;

    renderPage();

  }

});



document.addEventListener("keydown", event => {

  if (event.key === "ArrowRight") nextButton.click();

  if (event.key === "ArrowLeft") prevButton.click();



  if (event.key.toLowerCase() === "d") {

    document.body.classList.toggle("debug");

  }

});





/* =========================================================

   ЕДИНОЕ МАСШТАБИРОВАНИЕ КНИГИ

   ========================================================= */



const DESIGN_WIDTH = 1553;

const DESIGN_HEIGHT = 938;



const scene = document.querySelector(".scene");

const bookStage = document.querySelector(".book-stage");

const cover = document.querySelector(".book-cover");



function fitBookToFrame() {

  const width = scene.clientWidth;

  const height = scene.clientHeight;



  if (!width || !height) return;



  const scale = Math.min(

    width / DESIGN_WIDTH,

    height / DESIGN_HEIGHT

  );



  bookStage.style.setProperty("--book-scale", scale);

}



window.addEventListener("resize", fitBookToFrame);



if ("ResizeObserver" in window) {

  const resizeObserver = new ResizeObserver(fitBookToFrame);

  resizeObserver.observe(scene);

}



fitBookToFrame();

renderPage(false);
